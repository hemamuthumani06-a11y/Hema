<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduSpark - Contact</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f7fc;
}

nav{
    background:lightskyblue;
    padding:15px;
    text-align:center;
}

nav a{
    color:black;
    text-decoration:none;
    margin:0 15px;
    font-weight:bold;
}

nav a:hover{
    text-decoration:underline;
}

.container{
    width:90%;
    max-width:600px;
    background:rgba(0, 113, 241, 0.856);
    margin:40px auto;
    padding:30px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#5207b4;
    margin-bottom:20px;
}

input, textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

textarea{
    height:120px;
}

button{
    width:100%;
    padding:12px;
    background:#471b8d;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#005fa3;
}

.contact-info{
    text-align:center;
    margin-top:20px;
    color:#7107a1;
}

footer{
    background:#0077cc;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:30px;
}
</style>

</head>

<body>

<nav>
    <a href="home.html">Home</a>
    <a href="courses.html">Courses</a>
    <a href="features.html">Features</a>
    <a href="about.html">About</a>
    <a href="reviews.html">Reviews</a>
    <a href="contact.html">Contact</a>
</nav>

<div class="container">

<h1>Contact EduSpark</h1>

<form>
    <input type="text" placeholder="Enter Your Name" required>

    <input type="email" placeholder="Enter Your Email" required>

    <input type="text" placeholder="Enter Your Phone Number">

    <textarea placeholder="Enter Your Message"></textarea>

    <button type="submit">Send Message</button>
</form>

<div class="contact-info">
    <p>Email: support@eduspark.com</p>
    <p>Phone: +91 98765 43210</p>
    <p>Location: India</p>
</div>

</div>

<footer>
    <p>&copy; 2026 EduSpark. All Rights Reserved.</p>
</footer>

</body>
</html>
